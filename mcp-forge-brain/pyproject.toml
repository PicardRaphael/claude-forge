[project]
name = "mcp-forge-brain"
version = "1.0.0"
description = "MCP server for forge-brain vault — SQLite FTS5 backed, self-contained"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-forge-brain = "start:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
