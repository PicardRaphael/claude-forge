$schema: https://json-schema.org/draft/2020-12/schema
$id: forge-cognition/development-handoff-v1
type: object
required: [payload_schema, project_id, cdc, architecture, verdict, adrs, slices, risks, reviewer_conditions]
properties:
  payload_schema: {const: development-handoff-v1}
  project_id: {type: string, pattern: '^PRJ-[0-9]{4}-[0-9]{3}$'}
  cdc: {$ref: '#/$defs/pointer'}
  architecture: {$ref: '#/$defs/pointer'}
  verdict: {$ref: '#/$defs/pointer'}
  adrs: {type: array, items: {type: string}}
  slices:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, objective, acceptance_criteria, tests]
      properties:
        id: {type: string}
        objective: {type: string}
        acceptance_criteria: {type: array, minItems: 1, items: {type: string}}
        tests: {type: array, minItems: 1, items: {type: string}}
      additionalProperties: false
  risks: {type: array, items: {type: string}}
  reviewer_conditions: {type: array, items: {type: string}}
additionalProperties: false
$defs:
  pointer:
    type: object
    required: [document_id, revision, content_hash, series_id]
    properties:
      document_id: {type: string}
      revision: {type: integer, minimum: 1}
      content_hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      series_id: {type: string}
    additionalProperties: false
