$schema: https://json-schema.org/draft/2020-12/schema
$id: forge-cognition/cdc-handoff-v1
type: object
required: [payload_schema, problem, target_users, desired_outcomes, constraints, acceptance_criteria, assumptions, evidence, unknowns, non_goals]
properties:
  payload_schema: {const: cdc-handoff-v1}
  problem: {type: string, minLength: 1}
  target_users: {type: array, minItems: 1, items: {type: string}}
  desired_outcomes: {type: array, minItems: 1, items: {type: string}}
  constraints: {type: array, items: {type: string}}
  acceptance_criteria: {type: array, minItems: 1, items: {type: string}}
  assumptions: {type: array, items: {type: string}}
  evidence: {type: array, items: {type: string}}
  unknowns: {type: array, items: {type: string}}
  non_goals: {type: array, items: {type: string}}
additionalProperties: false
