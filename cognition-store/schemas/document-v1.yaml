$schema: https://json-schema.org/draft/2020-12/schema
$id: forge-cognition/document-v1
type: object
required:
  - id
  - schema_version
  - entity_type
  - memory_type
  - owner
  - namespace
  - visibility
  - status
  - validation_status
  - created_at
  - updated_at
  - confidence
  - confidence_basis
  - provenance
  - content_hash
  - revision
  - title
  - body
properties:
  id:
    type: string
    pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
  schema_version:
    const: 1
  entity_type:
    enum: [context, evidence, hypothesis, decision, episode, experiment, outcome, review, lesson, procedure, calibration, retrospective]
  status:
    enum: [candidate, validated, rejected, restricted, deprecated, superseded, archived]
  memory_type:
    enum: [semantic, episodic, procedural, calibration]
  project_id:
    type: [string, "null"]
  owner:
    type: string
  namespace:
    type: string
  visibility:
    type: string
  validation_status:
    enum: [pending, approved, rejected]
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  observed_at:
    type: [string, "null"]
    format: date-time
  valid_from:
    type: [string, "null"]
    format: date
  valid_until:
    type: [string, "null"]
    format: date
  review_after:
    type: [string, "null"]
    format: date
  confidence:
    type: number
    minimum: 0
    maximum: 1
  confidence_basis:
    type: string
  provenance:
    type: array
    minItems: 1
    items:
      type: object
      required: [type, reference]
      properties:
        type: {type: string}
        reference: {type: string}
      additionalProperties: false
  supersedes:
    type: [string, "null"]
  superseded_by:
    type: [string, "null"]
  outcome_ids:
    type: array
    items: {type: string}
  content_hash:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  revision:
    type: integer
    minimum: 1
  title:
    type: string
    minLength: 1
  aliases:
    type: array
    items: {type: string}
  tags:
    type: array
    items: {type: string}
  summary:
    type: string
  attributes:
    type: object
  body:
    type: string
    minLength: 1
additionalProperties: false
